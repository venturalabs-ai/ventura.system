name: Autonomous CI Retry

on:
  workflow_run:
    workflows:
      - CI
      - Repository Health
      - Ventura Production Standard
      - Ventura Autonomy Gate
      - Model Registry Freshness
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  retry-transient-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Retry failed jobs once
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
