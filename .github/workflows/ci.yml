name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q ventura_system scripts tests
      - name: Test adaptive router
        run: python -m unittest discover -s tests -p 'test_router.py' -v
      - name: Validate registry freshness
        run: python scripts/check_registry_freshness.py --max-age-days 7
      - name: Smoke benchmark
        run: python scripts/benchmark_router.py
