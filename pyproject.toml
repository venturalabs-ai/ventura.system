[project]
name = "ventura.system"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ventura Labs AI", email = "dev@venturalabs.ai" }
]
keywords = ["ai", "ventura", "automation"]

dependencies = [
    # Adicione suas dependências aqui
    # Exemplo:
    # "requests>=2.31.0",
    # "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/venturalabs-ai/ventura.system"
Repository = "https://github.com/venturalabs-ai/ventura.system"
Issues = "https://github.com/venturalabs-ai/ventura.system/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
